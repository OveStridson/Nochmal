<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nochmal?">
<title>Nochmal?</title>
<style>
/* =========================================================
   NOCHMAL? – Abendmodus
   Zero-dependency, kein Server, alles in localStorage.
   localStorage-Präfix: nochmal_  (teilt sich die Domain mit anderen Pages-Apps!)
   ========================================================= */
:root{
  --bg:#121016; --bg2:#17141c; --surface:#1e1a24; --surface2:#28232f; --line:#302a38;
  --text:#f4efe9; --muted:#a69dad; --faint:#6f6777;
  --accent:#6ea8ff; --accent-rgb:110,168,255; --accent-ink:#14111a; /* wird per JS aus der gewählten Farbe gesetzt */
  --good:#4ade80; --ok:#fbbf24; --bad:#fb7185;
  --good-bg:rgba(74,222,128,.13); --ok-bg:rgba(251,191,36,.13); --bad-bg:rgba(251,113,133,.13); --mix-bg:rgba(var(--accent-rgb),.14);
  --radius:18px;
  --font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;left:-20vw;right:-20vw;top:-20vh;height:70vh;pointer-events:none;z-index:0;
  background:radial-gradient(55% 60% at 50% 0%,rgba(var(--accent-rgb),.17),transparent 70%),radial-gradient(35% 45% at 88% 8%,rgba(251,113,133,.08),transparent 70%)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea{font:inherit;font-size:16px;color:var(--text)} /* 16px = kein Auto-Zoom auf iOS */
svg{display:block;max-width:100%}
.app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 112px)}

/* ---------- Kopf ---------- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.02em}
.brand h1 span{color:var(--accent)}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.iconbtn svg{width:22px;height:22px}

/* ---------- Suche & Chips ---------- */
.searchwrap{position:sticky;top:env(safe-area-inset-top,0);z-index:5;margin:0 -16px;padding:10px 16px 6px;background:linear-gradient(var(--bg) 75%,transparent)}
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--faint);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.15)}
.search svg{width:20px;height:20px;flex:none}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0}
.search input::placeholder{color:var(--faint)}

/* ---------- Küchen-Leiste & Lieblinge ---------- */
.cats{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 16px;margin:0 -16px;scrollbar-width:none;scroll-padding:0 16px}
.cats::-webkit-scrollbar,.favs::-webkit-scrollbar,.photos::-webkit-scrollbar{display:none}
.cats .cbtn{flex:none;position:relative;min-width:80px;padding:10px 10px 8px;white-space:nowrap}
.cnt{position:absolute;top:5px;right:5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;display:grid;place-items:center;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.cbtn[aria-pressed="true"] .cnt{background:var(--c);color:var(--bg)}
.shelf{display:flex;align-items:baseline;gap:8px;margin:4px 4px 10px;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.shelf small{font-size:12px;letter-spacing:0;color:var(--faint)}
.favs{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;margin:0 -16px 18px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 16px}
.fav{--c:var(--accent);flex:none;width:140px;scroll-snap-align:start;text-align:left;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden;transition:transform .15s}
.fav:active{transform:scale(.97)}
.fimg{position:relative;display:grid;place-items:center;height:96px;background:color-mix(in srgb,var(--c) 16%,var(--surface2))}
.fimg img{width:100%;height:100%;object-fit:cover}
.fimg .ico{background:none;box-shadow:none}
.fbadge{position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#0d1f14;font-size:13px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.fav b{display:block;padding:9px 10px 0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav small{display:block;padding:1px 10px 10px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbadge.ok{background:var(--ok);color:#2a1d02}.fbadge.bad{background:var(--bad);color:#2a0910}

/* ---------- Dashboard ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin:2px 0 6px}
.dash[hidden]{display:none}
.dash .favs{margin-bottom:0}
.dash .shelf{margin-top:0}
.hello{display:flex;align-items:center;gap:6px}
.hello>div{flex:1;min-width:0}
.hello h2{margin:0;font-size:25px;line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
.hello p{margin:5px 0 0;color:var(--muted);font-size:15px}
.scene{flex:none;width:132px;margin-right:-8px}
.scene svg{width:100%;height:auto;overflow:visible}
.scene .speed,.art .speed,.scene .beam,.art .beam{display:none}
.steam path{opacity:.4;transform-box:fill-box;transform-origin:center bottom;animation:steamUp 2.8s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.9s}
.steam path:nth-child(3){animation-delay:1.8s}
@keyframes steamUp{0%{opacity:0;transform:translateY(5px) scaleY(.7)}35%{opacity:.7}100%{opacity:0;transform:translateY(-8px) scaleY(1.1)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px 6px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:27px;font-weight:850;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:2px;font-size:12.5px;font-weight:700;color:var(--muted)}
.stat.bad{border-color:rgba(251,113,133,.28)}
.stat.bad b,.stat.bad span{color:var(--bad)}
.roll-btn{min-height:64px;font-size:18px}
.roll-btn svg{width:26px;height:26px}
.roll-hint{margin:0;padding:14px 16px;border-radius:16px;border:1px dashed var(--line);color:var(--muted);font-size:14px;text-align:center}
.slot{display:flex;align-items:center;justify-content:center;gap:10px;min-height:88px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.reel{width:64px;height:64px;overflow:hidden;border-radius:16px;background:var(--surface2);box-shadow:inset 0 10px 10px -8px rgba(0,0,0,.6),inset 0 -10px 10px -8px rgba(0,0,0,.6)}
.reel-strip{animation:reel var(--d,1.2s) cubic-bezier(.2,.7,.25,1) forwards}
.reel-strip>span{height:64px;display:grid;place-items:center}
@keyframes reel{to{transform:translateY(var(--end))}}
.pick-row{display:grid;grid-template-columns:1fr 84px;gap:8px}
.pick-row.land{animation:land .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes land{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
.pick{display:flex;align-items:center;gap:12px;min-width:0;min-height:88px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid rgba(74,222,128,.3);text-align:left;transition:transform .15s}
.pick:active,.reroll:active{transform:scale(.97)}
.pick .pimg{flex:none;width:54px;height:54px;border-radius:17px;object-fit:cover}
.pbody{flex:1;min-width:0}
.pbody b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody small{display:block;margin-top:1px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody i{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;font-size:13px;color:var(--muted)}
.reroll{display:grid;place-items:center;align-content:center;gap:5px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:var(--accent);font-size:12px;font-weight:800;line-height:1.15;text-align:center;transition:transform .15s}
.reroll svg{width:26px;height:26px}
.shelf-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-8px 0 2px}
.shelf-row .shelf{margin:0 4px;color:var(--accent)}
.shelf-row .shelf::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;vertical-align:1px}
.shelf-row .mini-btn{height:44px}

/* ---------- Leerer Zustand ---------- */
.empty .art{width:min(100%,300px);margin-bottom:-4px}
.empty .art svg{width:100%;height:auto;overflow:visible}
.steps{list-style:none;display:grid;gap:8px;width:100%;max-width:360px;margin:14px 0 4px;padding:0;text-align:left}
.steps li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.steps .num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:900}
.steps b{display:block}
.steps small{display:block;color:var(--muted);font-size:13px}

/* ---------- Fotos ---------- */
.thumb{position:relative;flex:none;width:54px;height:54px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:17px}
.thumb .ico{position:absolute;right:-6px;bottom:-6px;box-shadow:0 0 0 3px var(--surface)}
.dish.has-pic{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.dish .pic{width:64px;height:64px;border-radius:12px;object-fit:cover}
.dbody{min-width:0}
.photos{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:0 18px;scroll-snap-type:x mandatory;scroll-padding:0 18px;scrollbar-width:none}
.photos img{flex:none;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;scroll-snap-align:start;background:var(--surface)}
.photos.multi img{width:86%}
.pslot{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:88px;border-radius:16px;border:2px dashed var(--line);background:var(--surface);color:var(--muted);font-weight:750;font-size:15px;transition:opacity .2s}
.pslot svg{width:24px;height:24px}
.pslot.has{position:relative;display:block;border:0;overflow:hidden;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.pslot.has img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.pacts{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.pacts .mini-btn{height:44px;padding:0 14px;background:rgba(18,16,22,.75);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--text);border-color:rgba(255,255,255,.15)}
.busy{opacity:.5;pointer-events:none}

/* ---------- Icons ---------- */
.ico{--c:var(--accent);flex:none;width:54px;height:54px;border-radius:17px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c) 18%,var(--surface2));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 32%,transparent)}
.ico svg{width:42px;height:42px;overflow:visible}
.ico.big{width:88px;height:88px;border-radius:27px}.ico.big svg{width:70px;height:70px}
.ico.sm{width:36px;height:36px;border-radius:12px}.ico.sm svg{width:29px;height:29px}
.ico.mini{width:28px;height:28px;border-radius:9px}.ico.mini svg{width:23px;height:23px}
.ico.mid{width:42px;height:42px;border-radius:13px}.ico.mid svg{width:34px;height:34px}
.ico svg *{transform-box:fill-box;transform-origin:center}

/* Pizza: Stück wird rausgezogen, Käse zieht Fäden */
.p-string{opacity:0}
.poke .p-slice{animation:pSlice .95s cubic-bezier(.3,.7,.3,1)}
.poke .p-string{animation:pString .95s ease}
@keyframes pSlice{0%,100%{transform:none}35%,65%{transform:translate(7px,-6px)}}
@keyframes pString{0%,22%,78%,100%{opacity:0}32%,68%{opacity:1}}
/* Ramen: Dampf steigt */
.r-steam path{opacity:.35}
.poke .r-steam path{animation:rSteam 1.1s ease-out}
.poke .r-steam path:nth-child(2){animation-delay:.12s}
.poke .r-steam path:nth-child(3){animation-delay:.24s}
@keyframes rSteam{0%{opacity:.35;transform:none}35%{opacity:1}100%{opacity:0;transform:translateY(-9px)}}
/* Burger: Schichten hüpfen */
.poke .b-top{animation:bTop .75s cubic-bezier(.3,1.5,.5,1)}
.poke .b-let{animation:bLet .75s cubic-bezier(.3,1.5,.5,1)}
.poke .b-chs{animation:bChs .75s cubic-bezier(.3,1.5,.5,1)}
.poke .b-bot{animation:bBot .75s cubic-bezier(.3,1.5,.5,1)}
@keyframes bTop{0%,100%{transform:none}40%{transform:translateY(-8px) rotate(-4deg)}}
@keyframes bLet{0%,100%{transform:none}40%{transform:translateY(-5px)}}
@keyframes bChs{0%,100%{transform:none}40%{transform:translateY(-2.5px)}}
@keyframes bBot{0%,100%{transform:none}40%{transform:translateY(3px)}}
/* Döner: Spieß dreht sich */
.poke .d-str{animation:dSpin .3s linear 3}
@keyframes dSpin{to{transform:translateX(-6px)}}
/* Curry: blubbert */
.c-bub circle{opacity:0}
.poke .c-bub circle{animation:cBub 1s ease-out}
.poke .c-bub circle:nth-child(2){animation-delay:.18s}
.poke .c-bub circle:nth-child(3){animation-delay:.36s}
@keyframes cBub{0%{opacity:0;transform:translateY(2px) scale(.4)}30%{opacity:1;transform:translateY(-3px) scale(1)}80%{opacity:1;transform:translateY(-8px) scale(1.15)}100%{opacity:0;transform:translateY(-10px) scale(1.7)}}
/* Sushi: Stäbchen klappern */
.ico svg .s-stick{transform-origin:100% 100%}
.poke .s-a{animation:sA .26s ease-in-out 3}
.poke .s-b{animation:sB .26s ease-in-out 3}
.poke .s-roll{animation:sHop .5s cubic-bezier(.3,1.6,.5,1) .5s}
@keyframes sA{50%{transform:rotate(-5deg)}}
@keyframes sB{50%{transform:rotate(4deg)}}
@keyframes sHop{50%{transform:translateY(-3px)}}
/* Sonstiges: Cloche hebt sich */
.ico svg .o-lid{transform-origin:0% 100%}
.o-spark{opacity:0}
.poke .o-lid{animation:oLid 1s cubic-bezier(.3,.7,.3,1)}
.poke .o-spark{animation:oSpark 1s ease}
@keyframes oLid{0%,100%{transform:none}35%,70%{transform:translate(-2px,-10px) rotate(-12deg)}}
@keyframes oSpark{0%,25%,80%,100%{opacity:0;transform:scale(.4)}40%,68%{opacity:1;transform:scale(1)}}
/* Pasta: Gabel dreht Nudeln auf */
.poke .pa-fork{animation:paFork .9s ease-in-out}
.poke .pa-nood{animation:paNood .9s ease-in-out}
@keyframes paFork{0%,100%{transform:none}30%{transform:rotate(-28deg) translateY(2px)}65%{transform:rotate(18deg)}}
@keyframes paNood{0%,100%{transform:none}30%{transform:scaleX(.94) translateY(-1px)}65%{transform:scaleX(1.04)}}
/* Taco: Füllung hüpft */
.poke .t-fill>*{animation:tHop .6s cubic-bezier(.3,1.6,.5,1)}
.poke .t-fill>*:nth-child(2){animation-delay:.08s}
.poke .t-fill>*:nth-child(3){animation-delay:.16s}
.poke .t-shell{animation:tSquish .6s ease}
@keyframes tHop{50%{transform:translateY(-6px)}}
@keyframes tSquish{30%{transform:scale(1.05,.94)}}
/* Bowl: Salat wird geschwenkt */
.poke .bw-top>*{animation:bwToss .8s cubic-bezier(.3,1.4,.5,1)}
.poke .bw-top>*:nth-child(even){animation-delay:.07s}
@keyframes bwToss{40%{transform:translateY(-9px) rotate(14deg)}}
/* Süßes: Donut dreht sich */
.poke .sw-donut{animation:swSpin .8s cubic-bezier(.3,.7,.3,1)}
@keyframes swSpin{to{transform:rotate(360deg)}}
/* Schnitzel: Zitrone wird ausgedrückt */
.sc-drop{opacity:0}
.poke .sc-lemon{animation:scLemon 1s cubic-bezier(.3,.7,.3,1)}
.poke .sc-drop{animation:scDrop 1s ease}
@keyframes scLemon{0%,100%{transform:none}35%,60%{transform:translate(-3px,6px) rotate(-25deg) scale(.9,1)}}
@keyframes scDrop{0%,40%{opacity:0;transform:none}55%{opacity:1}100%{opacity:0;transform:translateY(7px)}}
/* Gyros & Falafel: Füllung hüpft */
.poke .g-fill>*,.poke .f-balls>*{animation:tHop .6s cubic-bezier(.3,1.6,.5,1)}
.poke .g-fill>*:nth-child(2),.poke .f-balls>*:nth-child(2){animation-delay:.08s}
.poke .g-fill>*:nth-child(3),.poke .f-balls>*:nth-child(3){animation-delay:.16s}
/* Hähnchen: Keule wackelt */
.poke .ch-leg{animation:chWiggle .8s ease-in-out}
@keyframes chWiggle{0%,100%{transform:none}25%{transform:rotate(-12deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-5deg)}}
/* Frühstück: Spiegelei wird gewendet */
.poke .bf-pan{animation:bfPan .9s ease}
.poke .bf-egg{animation:bfEgg .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes bfPan{0%,100%{transform:none}15%{transform:translateX(-3px) rotate(-3deg)}30%{transform:translateX(3px) rotate(2deg)}}
@keyframes bfEgg{0%,25%,100%{transform:none}50%{transform:translateY(-10px) rotate(-160deg) scale(.9)}75%{transform:translateY(-2px) rotate(-360deg)}}
/* Alle: Kacheln ploppen */
.poke .a-sq>*{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.poke .a-sq>*:nth-child(2){animation-delay:.06s}
.poke .a-sq>*:nth-child(3){animation-delay:.12s}
.poke .a-sq>*:nth-child(4){animation-delay:.18s}

/* ---------- Karten ---------- */
.list{display:grid;gap:10px}
@media (min-width:620px){.list{grid-template-columns:1fr 1fr}}
.card{position:relative;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);transition:transform .15s ease,border-color .2s}
.card:active{transform:scale(.98)}
.cbody,.hbody{min-width:0}
.card h3{margin:0;font-size:17px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.tally{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:13px;font-weight:800}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.mixed{background:var(--mix-bg);color:var(--accent)}
.peek{font-size:13px;color:var(--muted);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peek b{font-weight:650;color:var(--text)}
.v-good{color:var(--good);font-weight:900}.v-ok{color:var(--ok);font-weight:900}.v-bad{color:var(--bad);font-weight:900}.v-mixed{color:var(--accent);font-weight:900}

.stagger>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.fresh{animation:freshGlow 2.4s ease-out}
.stagger>.fresh{animation:rise .5s cubic-bezier(.2,.8,.2,1) both,freshGlow 2.4s ease-out .4s}
@keyframes freshGlow{0%,30%{box-shadow:0 0 0 2px var(--accent),0 0 30px rgba(var(--accent-rgb),.55)}100%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),0)}}

.demo-banner{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding:10px 10px 10px 14px;border-radius:14px;border:1px dashed rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.08);font-size:13px;color:var(--muted)}
.demo-banner span{flex:1;min-width:0}
.demo-banner b{color:var(--text)}
.demo-banner button{flex:none;height:34px;padding:0 12px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px}

/* ---------- Leer / keine Treffer ---------- */
.empty,.noresult{display:grid;justify-items:center;gap:8px;text-align:center;padding:36px 8px}

.back{display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 16px 0 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:700;color:var(--muted)}
.back svg{width:20px;height:20px}
.hero{display:flex;align-items:center;gap:16px;padding:18px;border-radius:24px;background:var(--surface);border:1px solid var(--line);margin:14px 0 4px;view-transition-name:hero}
.hero h2{margin:0;font-size:26px;line-height:1.15;overflow-wrap:anywhere}
.sec{margin-top:22px}
.sec h4{display:flex;align-items:center;gap:8px;margin:0 4px 10px;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase}
.sec h4 .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}

.dish{position:relative;display:block;width:100%;text-align:left;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden;margin-bottom:8px;transition:transform .15s}
.dish:active{transform:scale(.985)}
.dish.good{border-color:rgba(74,222,128,.22)}.dish.bad{border-color:rgba(251,113,133,.25)}
.dish .row1{display:flex;align-items:baseline;gap:10px}
.dish.bad .row1{padding-right:124px}
.dish .name{flex:1;min-width:0;font-weight:750}
.dish .price{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.votes{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.vote{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700}
.vote .sym{font-weight:900}
.vote.good{background:var(--good-bg);color:var(--good)}.vote.ok{background:var(--ok-bg);color:var(--ok)}.vote.bad{background:var(--bad-bg);color:var(--bad)}
.count{font-size:12px;color:var(--faint);margin-left:2px}
.note{margin-top:8px;font-size:14px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.addhere{margin-top:18px}

/* Stempel */
.stamp{position:absolute;right:12px;top:12px;padding:3px 8px;border:2.5px solid var(--bad);border-radius:7px;color:var(--bad);font-weight:900;font-size:11px;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-10deg);opacity:.78;pointer-events:none;text-shadow:0 0 8px rgba(251,113,133,.45);white-space:nowrap}
.stamp.slam{animation:slam .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes slam{0%{opacity:0;transform:scale(3) rotate(-26deg)}55%{opacity:1;transform:scale(.9) rotate(-9deg)}100%{opacity:.78;transform:scale(1) rotate(-10deg)}}
.stamp-layer{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2}
.stamp.big{position:static;font-size:24px;padding:6px 16px;border-width:4px;border-radius:10px;background:rgba(23,20,28,.75);animation:bigSlam 1.6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bigSlam{0%{opacity:0;transform:scale(3) rotate(-26deg)}22%{opacity:1;transform:scale(.9) rotate(-9deg)}32%{transform:scale(1) rotate(-10deg)}80%{opacity:1;transform:scale(1) rotate(-10deg)}100%{opacity:0;transform:scale(1.05) rotate(-10deg)}}
.thud{animation:thud .36s ease var(--td,.3s)}
.dish.fresh.thud{animation:thud .36s ease .3s,freshGlow 2.4s ease-out}
@keyframes thud{0%,100%{transform:none}25%{transform:translate(-3px,1px) rotate(-.6deg)}50%{transform:translate(3px,-1px) rotate(.6deg)}75%{transform:translate(-2px,0)}}

/* ---------- Sheet ---------- */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(6,5,9,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;transition:opacity .25s}

.sheet.open{transform:none}
.sheet.thud{--td:.12s}
.grab{display:block;width:100%;height:22px;margin:-4px 0 6px}
.grab::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sheet h2{margin:0 0 16px;font-size:21px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sh-head h2{margin:0}
.field{margin-bottom:16px}
.field label,.lbl{display:block;font-size:13px;font-weight:750;color:var(--muted);margin:0 2px 7px}
.inp{width:100%;height:50px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);outline:0;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
textarea.inp{height:auto;min-height:84px;padding:12px 14px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.15)}
.inp::placeholder{color:var(--faint)}
.inp.err{border-color:var(--bad);animation:thud .36s ease}
.row2{display:grid;grid-template-columns:1fr 112px;gap:10px}
.cuisines{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.cbtn{--c:var(--accent);display:grid;justify-items:center;gap:6px;padding:10px 4px 8px;border-radius:16px;background:var(--surface);border:2px solid transparent;font-size:12px;font-weight:700;color:var(--muted);transition:border-color .2s,background .2s,color .2s}
.cuisines .cbtn{padding:10px 2px 8px;text-align:center;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:anywhere}
.cbtn[aria-pressed="true"]{border-color:var(--c);color:var(--text);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.verdicts{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vbtn{position:relative;overflow:hidden;display:grid;justify-items:center;gap:4px;padding:14px 6px;border-radius:16px;background:var(--surface);border:2px solid transparent;color:var(--muted);font-weight:750;font-size:14px;transition:transform .15s,border-color .2s,background .2s,color .2s,box-shadow .2s}
.vbtn .sym{font-size:25px;line-height:1;font-weight:900}
.vbtn:active{transform:scale(.95)}

.vbtn.ok[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);box-shadow:0 0 24px -6px var(--ok)}
.vbtn.bad[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);box-shadow:0 0 24px -6px var(--bad)}
.vbtn.shine::after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:shine .7s ease-out forwards}
@keyframes shine{to{transform:translateX(120%)}}
.vbtn.shrug{animation:shrug .6s ease}
@keyframes shrug{0%,100%{transform:none}20%{transform:rotate(-4deg) translateY(-2px)}45%{transform:rotate(4deg) translateY(-2px)}70%{transform:rotate(-2deg)}}
.hist{margin:6px 0 16px}
.hitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}

.hmeta{font-size:14px;color:var(--muted);padding-top:3px}
.hmeta b{color:var(--text)}
.hmeta .note{margin-top:4px}
.mini-btn{height:34px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 16px;border-radius:16px;font-weight:800;font-size:16px;transition:transform .15s}
.btn:active{transform:scale(.98)}

.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.danger{color:var(--bad);border:1px solid rgba(251,113,133,.35)}
.btn svg{width:20px;height:20px}
.btns{display:grid;gap:10px}
.hint{margin:8px 2px 0;font-size:13px;color:var(--muted)}
.set-group{margin-bottom:20px}
.welcome{display:grid;justify-items:center;gap:6px;text-align:center;margin:6px 0 18px}
.welcome h2{margin:10px 0 0}
.welcome p{margin:0;color:var(--muted);max-width:36ch}
.toggle{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.toggle small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.sw{flex:none;position:relative;width:52px;height:32px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--text);transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .2s}
.toggle input:checked+.sw{background:var(--accent)}
.toggle input:checked+.sw::after{transform:translateX(20px);background:var(--accent-ink)}
.toggle input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}

/* Farbwahl */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.swatch{position:relative;display:grid;justify-items:center;gap:6px;padding:10px 4px 8px;border-radius:16px;background:var(--surface);border:2px solid transparent;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:border-color .2s,color .2s}
.swatch span{width:34px;height:34px;border-radius:50%;background:var(--sw);box-shadow:0 0 16px -4px var(--sw),inset 0 0 0 2px rgba(255,255,255,.15)}
.swatch.on{border-color:var(--accent);color:var(--text)}
.swatch.on span{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.swatch.custom span{background:radial-gradient(circle,var(--sw) 50%,transparent 53%),conic-gradient(#ff6b6b,#ffd93d,#6bff95,#4fd1ff,#8b8cff,#f78fb3,#ff6b6b)}
.swatch.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
html.theming *{transition:background-color .35s,border-color .35s,color .35s,box-shadow .35s!important}

/* ---------- FAB, Toast, Roller ---------- */
.fab{position:fixed;right:max(18px,calc(50vw - 322px));bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:20;width:64px;height:64px;border-radius:22px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 14px 34px -10px rgba(var(--accent-rgb),.8);transition:transform .15s}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.92)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);z-index:60;transform:translate(-50%,16px);opacity:0;max-width:calc(100vw - 32px);padding:12px 18px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:14px;text-align:center;box-shadow:0 14px 40px -12px #000;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scoot{position:fixed;left:0;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:55;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.scoot svg{width:130px;height:66px}
.scoot.ltr{animation:driveL 2s cubic-bezier(.45,.05,.4,1) forwards}
.scoot.rtl{animation:driveR 2s cubic-bezier(.45,.05,.4,1) forwards}
.scoot.rtl svg{transform:scaleX(-1)}
@keyframes driveL{from{transform:translateX(-170px)}to{transform:translateX(calc(100vw + 30px))}}
@keyframes driveR{from{transform:translateX(calc(100vw + 30px))}to{transform:translateX(-170px)}}
.scoot .bubble{background:var(--text);color:var(--bg);font-weight:900;font-size:13px;padding:5px 11px;border-radius:10px;white-space:nowrap;animation:pop .3s .15s both}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.scoot .wheel{transform-box:fill-box;transform-origin:center;animation:spin .35s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scoot .rider{animation:bump .22s ease-in-out infinite alternate}
@keyframes bump{to{transform:translateY(-1.5px)}}
.scoot .speed{animation:speed .3s linear infinite}
@keyframes speed{0%{opacity:.9;transform:none}100%{opacity:.2;transform:translateX(-6px)}}

/* ---------- View Transitions ---------- */
::view-transition-group(hero){animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.26s}

/* ---------- Animationen aus ---------- */
.no-anim *,.no-anim *::before,.no-anim *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>

const hexRgb = h => { h = h.replace('#', ''); if (h.length === 3) h = [...h].map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };

  const isPreset = PRESETS.some(p => p.hex === accent);

  const now = new Date(), day = 86400000;

  if (ts >= today) return 'heute';
  if (ts >= today - day) return 'gestern';
  const diff = Math.ceil((today - ts) / day);
  if (diff < 7) return `vor ${diff} Tagen`;
  const d = new Date(ts);
  return d.toLocaleDateString('de-DE', d.getFullYear() === now.getFullYear() ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' });
}

/* ===================== Fotos (IndexedDB) ===================== */
// Fotos sind zu groß für localStorage → eigene IndexedDB „nochmal“ (bleibt lokal auf dem Gerät, kostet nichts).
// Schlüssel = Eintrags-id, Wert = JPEG-Data-URL. Beim Start einmal komplett in `photos` geladen, damit das Rendern synchron bleibt.
const photos = new Map();
let idbP = null;
const idb = () => idbP || (idbP = new Promise((res, rej) => {
  const r = indexedDB.open('nochmal', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('photos');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}));
async function idbRun(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => { const tx = db.transaction('photos', mode); fn(tx.objectStore('photos')); tx.oncomplete = () => res(true); tx.onerror = tx.onabort = () => rej(tx.error); });
}
async function loadPhotos() {
  try { await idbRun('readonly', st => { const c = st.openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { photos.set(cur.key, cur.value); cur.continue(); } }; }); } catch (e) {}
}
// Map sofort aktualisieren (für die Anzeige), IndexedDB im Hintergrund. Liefert false, wenn das Speichern scheitert.
function setPhotos(map) {
  for (const [id, p] of map) if (p) photos.set(id, p); else photos.delete(id);
  if (!map.size) return Promise.resolve(true);
  return idbRun('readwrite', st => { for (const [id, p] of map) if (p) st.put(p, id); else st.delete(id); }).catch(() => false);
}
const setPhoto = (id, p) => setPhotos(new Map([[id, p]]));
const photoOf = e => photos.get(e.id) || null;
// Fotos aus der ersten Foto-Version lagen noch im localStorage → umziehen
async function migratePhotos() {
  const old = entries.filter(e => 'photo' in e);
  if (!old.length) return;
  if (await setPhotos(new Map(old.filter(e => e.photo).map(e => [e.id, e.photo])))) { old.forEach(e => { delete e.photo; }); persist(); }
}

const live = () => entries.filter(e => !e.deleted);
function groupDishes(es) {
  const map = new Map();
  for (const e of es) { const k = norm(e.dish); if (!map.has(k)) map.set(k, { key: k, entries: [] }); map.get(k).entries.push(e); }
  return [...map.values()].map(d => {
    d.entries.sort((a, b) => b.createdAt - a.createdAt);
    d.name = d.entries[0].dish;
    d.price = d.entries.find(e => e.price != null)?.price ?? null;
    d.note = d.entries.find(e => e.note)?.note || '';
    d.photos = d.entries.map(photoOf).filter(Boolean); d.photo = d.photos[0] || null;
    const by = new Map(); for (const e of d.entries) if (!by.has(e.author)) by.set(e.author, e);
    d.byAuthor = [...by.values()];
    const vs = new Set(d.byAuthor.map(e => e.verdict));
    d.status = vs.size === 1 ? [...vs][0] : 'mixed';
    d.last = d.entries[0].createdAt;
    return d;
  }).sort((a, b) => b.last - a.last);
}
function groupRestaurants() {
  const map = new Map();
  for (const e of live()) { const k = norm(e.restaurant); if (!map.has(k)) map.set(k, { key: k, entries: [] }); map.get(k).entries.push(e); }
  return [...map.values()].map(r => {
    r.entries.sort((a, b) => b.createdAt - a.createdAt);
    r.name = r.entries[0].restaurant; r.cuisine = r.entries[0].cuisine;
    r.photo = r.entries.map(photoOf).find(Boolean) || null;
    r.last = Math.max(...r.entries.map(e => e.updatedAt));
    r.dishes = groupDishes(r.entries);
    r.tally = { good: 0, mixed: 0, ok: 0, bad: 0 }; r.dishes.forEach(d => r.tally[d.status]++);
    return r;
  }).sort((a, b) => b.last - a.last);
}

function countUp(root) {

// „Neu von …“: nochmal_inbox = { from, ids, at }, 7 Tage gültig; gelöschte/fehlende IDs fallen raus
function inbox() {
  const ib = store.get(LS.inbox, null);
  if (!ib || !Array.isArray(ib.ids) || !(Date.now() - ib.at < 7 * 86400000)) { if (ib) store.del(LS.inbox); return null; }
  const byId = new Map(live().map(e => [e.id, e])), seen = new Set(), list = [];

  for (let n = 0; pool.length > 1 && ui.pick && p.r.key === ui.pick.rKey && p.d.key === ui.pick.dKey && n < 20; n++) p = pool[Math.floor(Math.random() * pool.length)];

// Handyfotos sind mehrere MB groß → auf Bildschirmgröße rechnen (scharf auf dem iPhone, Exportdatei bleibt handlich)
async function shrinkPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    let q = 0.8, out = cv.toDataURL('image/jpeg', q);
    while (out.length > 350000 && q > 0.45) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

/* ===================== Speichern / Löschen ===================== */
function saveEntry() {
  const st = ui.edit.st, isEdit = !!ui.edit.id;
  const restaurant = $('#f-r').value.trim().replace(/\s+/g, ' ');
  const dish = $('#f-d').value.trim().replace(/\s+/g, ' ');
  const pr = $('#f-p').value.trim().replace(/[\s€]/g, '').replace(',', '.');
  const price = pr === '' ? null : (isFinite(+pr) && +pr >= 0 ? Math.round(+pr * 100) / 100 : NaN);
  const note = $('#f-n').value.trim();
  if (!restaurant) return fieldErr('#f-r', 'Welches Restaurant?');
  if (!dish) return fieldErr('#f-d', 'Welches Gericht?');
  if (Number.isNaN(price)) return fieldErr('#f-p', 'Preis bitte als Zahl, z. B. 9,50');
  if (!st.verdict) { restart($('#verdicts'), 'thud'); return toast('Wie war’s? Tipp auf die Ampel.'); }
  const existing = groupRestaurants().find(r => r.key === norm(restaurant));
  const rName = existing ? existing.name : restaurant; // gleiche Schreibweise beibehalten
  const now = Date.now(), photo = st.photo || null; let id;
  if (isEdit) {
    const e = entries.find(x => x.id === ui.edit.id);
    Object.assign(e, { restaurant: rName, cuisine: st.cuisine, dish, price, verdict: st.verdict, note, updatedAt: now }); id = e.id;
  } else {
    id = uuid();
    entries.push({ id, restaurant: rName, cuisine: st.cuisine, dish, price, verdict: st.verdict, note, author: user, createdAt: now, updatedAt: now, deleted: false });
  }
  if (photo !== (photos.get(id) || null)) {
    setPhoto(id, photo).then(ok => { if (!ok) toast('Foto konnte nicht gespeichert werden'); });
    if (photo) try { navigator.storage?.persist?.(); } catch (e) {} // bittet den Browser, die Fotos nicht aufzuräumen
  }
  persist(); closeSheet();
  ui.fresh = new Set([id]); setTimeout(() => ui.fresh.clear(), 4000);
  const verdict = st.verdict, rKey = norm(rName), dKey = norm(dish);
  const after = () => {
    const row = document.querySelector(`.dish[data-dish="${CSS.escape(dKey)}"]`);
    if (row) {
      row.scrollIntoView({ block: 'center', behavior: animOn() ? 'smooth' : 'auto' });
      if (verdict === 'bad' && animOn()) { const s = row.querySelector('.stamp'); if (s) restart(s, 'slam'); restart(row, 'thud'); }
    }
    if (!isEdit) scooter('ltr', 'Geliefert!');
    toast(isEdit ? 'Änderung gespeichert' : 'Gespeichert');
  };
  if (ui.view === 'detail' && ui.rKey === rKey) { renderDetail(); setTimeout(after, 60); }
  else openRestaurant(rKey, null, { noStagger: true }).then(after);
}
function deleteEntry() {
  const e = entries.find(x => x.id === ui.edit.id); if (!e) return;
  if (!confirm('Diesen Eintrag löschen?')) return;
  e.deleted = true; e.updatedAt = Date.now(); // Lösch-Markierung, damit der Import ihn nicht zurückholt
  setPhoto(e.id, null);
  persist(); closeSheet(); rerender(); toast('Gelöscht');
}

/* ===================== Teilen / Import ===================== */
function payload(list, header) {
  // v2: Einträge können ein Foto (photo) haben – alte v1-Dateien bleiben lesbar
  const withPhotos = list.map(e => photos.has(e.id) ? { ...e, photo: photos.get(e.id) } : e);
  const json = JSON.stringify({ app: 'nochmal', v: 2, from: user, exportedAt: Date.now(), entries: withPhotos });
  return `${header}\n\nIn „Nochmal?“ öffnen: Einstellungen → Datei importieren.\n---\n${json}`;
}
async function shareFile(name, text, title) {
  const file = new File([text], name, { type: 'text/plain' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title }); return 'shared'; }
  } catch (e) { if (e && e.name === 'AbortError') return 'aborted'; }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return 'downloaded';
}
const shareFeedback = r => { if (r === 'downloaded') toast('Datei gespeichert – jetzt in Telegram anhängen'); else if (r === 'shared') toast('Geteilt'); };
async function shareDish() {
  const c = ui.dishCtx; if (!c) return;
  const seen = new Set(), lines = [];
  for (const e of c.entries) if (!e.demo && !seen.has(e.author)) { seen.add(e.author); lines.push(`${VERDICT[e.verdict].emoji} ${e.restaurant} – ${e.dish} (${e.author}${e.note ? ': „' + e.note + '“' : ''})`); }
  const real = c.entries.filter(e => !e.demo);
  if (!real.length) { toast('Demo-Einträge lassen sich nicht teilen'); return; }
  shareFeedback(await shareFile(`nochmal-${slug(c.rName)}-${slug(c.name)}.txt`, payload(real,`Nochmal? – Tipp von ${user}\n${lines.join('\n')}`), `${c.rName} – ${c.name}`));
}
async function exportAll() {
  const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const real = entries.filter(e => !e.demo);
  if (!real.length) { toast('Noch keine eigenen Bewertungen zum Exportieren'); return; }
  shareFeedback(await shareFile(`nochmal-alles-${stamp}.txt`, payload(real, `Nochmal? – Sammlung von ${user}\n📦 ${real.filter(e => !e.deleted).length} Bewertungen, Stand ${d.toLocaleDateString('de-DE')}`), 'Nochmal? – Sammlung'));
}
function parsePayload(text) {
  const m = text.indexOf('\n---\n');
  const json = m >= 0 ? text.slice(m + 5) : text.slice(text.indexOf('{'));
  const d = JSON.parse(json);
  if (!d || d.app !== 'nochmal' || !Array.isArray(d.entries)) throw new Error('format');
  return d;
}
function clean(x) {
  if (!x || x.demo || typeof x.id !== 'string' || !x.id || !VERDICT[x.verdict]) return null;
  const s = (t, n) => String(t ?? '').trim().slice(0, n);
  const restaurant = s(x.restaurant, 80), dish = s(x.dish, 100);
  if (!restaurant || !dish) return null;
  const num = t => Number.isFinite(+t) && +t > 0 ? +t : Date.now();
  return { id: x.id.slice(0, 64), restaurant, cuisine: CMAP[x.cuisine] ? x.cuisine : 'other', dish,
    price: typeof x.price === 'number' && isFinite(x.price) ? Math.round(x.price * 100) / 100 : null,
    verdict: x.verdict, note: s(x.note, 500),
    photo: typeof x.photo === 'string' && x.photo.length < 1500000 && /^data:image\/(jpeg|png|webp);base64,[a-z0-9+/]+=*$/i.test(x.photo) ? x.photo : null,
    author: s(x.author, 24) || 'Unbekannt',
    createdAt: num(x.createdAt), updatedAt: num(x.updatedAt), deleted: !!x.deleted };
}
function merge(list) {
  const byId = new Map(entries.map(e => [e.id, e])); let added = 0, updated = 0; const fresh = new Set(), pics = new Map();
  for (const raw of list) {
    const c = clean(raw); if (!c) continue;
    const { photo, ...x } = c; // Foto gehört in die IndexedDB, nicht in den Eintrag
    const ex = byId.get(x.id);
    if (!ex) { entries.push(x); byId.set(x.id, x); if (!x.deleted) { added++; fresh.add(x.id); } }
    else if (x.updatedAt > ex.updatedAt) { Object.assign(ex, x); updated++; if (!x.deleted) fresh.add(x.id); }
    else continue;
    if (photo || photos.has(x.id)) pics.set(x.id, x.deleted ? null : photo);
  }
  if (pics.size) setPhotos(pics).then(ok => { if (!ok) toast('Fotos konnten nicht gespeichert werden'); });
  if (added || updated) persist();
  return { added, updated, fresh };
}
$('#fileIn').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  let data;
  try { data = parsePayload(await f.text()); } catch (e) { toast('Das ist keine gültige Nochmal?-Datei'); return; }
  const res = merge(data.entries);
  noteInbox(res.fresh, data.from);
  ui.sheetLocked = false; closeSheet();
  if (!res.added && !res.updated) { toast('Alles schon bekannt – nichts Neues dabei'); return; }
  ui.fresh = res.fresh; setTimeout(() => ui.fresh.clear(), 4000);
  ui.q = ''; ui.cuisine = 'all';
  if (ui.view === 'detail') history.back(); // zurück zur Übersicht
  ui.view = 'home'; renderHome({ stagger: true }); window.scrollTo(0, 0);
  const from = data.from && data.from !== user ? data.from : null;
  scooter('rtl', from ? `Post von ${from}!` : 'Backup da!');
  toast([res.added && `${res.added} neu`, res.updated && `${res.updated} aktualisiert`].filter(Boolean).join(' · '));
});

$('#photoIn').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f || !ui.edit) return;
  const slot = $('#photo-slot'); slot?.classList.add('busy');
  try { ui.edit.st.photo = await shrinkPhoto(f); syncPhoto(); }
  catch (e) { toast('Das Foto ließ sich nicht laden'); }
  finally { slot?.classList.remove('busy'); }
});

function demo() {
  const D = 86400000, n = Date.now();
  DEMO_ROWS.forEach(([restaurant, cuisine, dish, price, verdict, who, note, days], i) => {
    const t = n - days * D - i * 60000;
    entries.push({ id: uuid(), restaurant, cuisine, dish, price, verdict, note, author: who === me ? (user || 'Ich') : 'Gast', createdAt: t, updatedAt: t, deleted: false, demo: true });
  });
  persist();
}

function migrateLegacyDemo() {
  const sig = new Set(DEMO_ROWS.map(r => `${r[0]}|${r[2]}|${r[3]}|${r[6]}`));
  let changed = false;
  for (const e of entries) if (!e.demo && sig.has(`${e.restaurant}|${e.dish}|${e.price}|${e.note}`)) { e.demo = true; changed = true; }
  if (changed) persist();
}

/* ===================== Kleinkram ===================== */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
function scooter(dir, text) {
  if (!animOn()) return;
  const el = document.createElement('div');
  el.className = 'scoot ' + dir; el.setAttribute('aria-hidden', 'true');
  el.innerHTML = `<div class="bubble">${esc(text)}</div>${SCOOTER}`;
  document.body.appendChild(el);
  el.addEventListener('animationend', ev => { if (ev.target === el) el.remove(); });
  setTimeout(() => el.remove(), 3000);
}

/* ===================== Events ===================== */
document.addEventListener('click', ev => {
  const pk = ev.target.closest('[data-poke]');
  const el = ev.target.closest('[data-act]');
  if (pk && (!el || !el.contains(pk))) poke(pk);
  if (!el) return;
  switch (el.dataset.act) {
    case 'open': openRestaurant(el.dataset.key, el); break;
    case 'back': if (history.state && history.state.nm === 'detail') history.back(); else goHome(); break;
    case 'settings': openSettings(); break;
    case 'cuisine':
      ui.cuisine = el.dataset.c === ui.cuisine ? 'all' : el.dataset.c;
      renderList(true); poke($(`#cats .cbtn[data-c="${ui.cuisine}"] .ico`)); break;
    case 'roll': roll(); break;
    case 'inbox-seen': store.del(LS.inbox); el.closest('section')?.remove(); break;
    case 'pick-photo': $('#photoIn').click(); break;
    case 'drop-photo': ui.edit.st.photo = null; syncPhoto(); break;
    case 'add': { const r = ui.view === 'detail' ? currentRestaurant() : null; openEditor(r ? { restaurant: r.name, cuisine: r.cuisine } : {}); break; }
    case 'new-from-search': openEditor({ restaurant: ui.q.trim() }); break;
    case 'dish': openDish(el.dataset.dish); break;
    case 'edit': openEditor({ id: el.dataset.id }); break;
    case 'rate-again': { const d = ui.dishCtx; openEditor({ restaurant: d.rName, cuisine: d.cuisine, dish: d.name }); break; }
    case 'share-dish': shareDish(); break;
    case 'verdict': setVerdict(el); break;
    case 'pick-cuisine': ui.edit.st.cuisine = el.dataset.c; syncCuisineBtns(true); break;
    case 'save': saveEntry(); break;
    case 'delete': deleteEntry(); break;
    case 'close': closeSheet(); break;
    case 'save-name': {
      const v = $('#f-name').value.trim(); if (!v) return fieldErr('#f-name', 'Wie heißt du?');
      user = v; store.set(LS.user, v); ui.sheetLocked = false; closeSheet(); rerender(); toast(`Hallo ${v}!`); break;
    }
    case 'save-settings': {
      const v = $('#f-name').value.trim(); if (!v) return fieldErr('#f-name', 'Name darf nicht leer sein');
      user = v; store.set(LS.user, v); closeSheet(); rerender(); break;
    }
    case 'accent': setAccent(el.dataset.hex); break;
    case 'export-all': exportAll(); break;
    case 'import': $('#fileIn').click(); break;
    case 'demo': demo(); closeSheet(); ui.view = 'home'; renderHome({ stagger: true }); toast('Demo-Daten geladen'); break;
    case 'remove-demo': {
      const own = entries.some(e => !e.demo && !e.deleted);
      removeDemo(); closeSheet();
      if (ui.view === 'detail') { if (history.state && history.state.nm === 'detail') history.back(); ui.view = 'home'; }
      renderHome({ stagger: own }); window.scrollTo(0, 0); toast('Demo-Daten entfernt');
      break;
    }
    case 'reset':
      if (!confirm('Wirklich alle Bewertungen auf diesem Gerät löschen? Das lässt sich nicht rückgängig machen. Tipp: vorher exportieren.')) return;
      setPhotos(new Map(entries.map(e => [e.id, null]))); entries = []; persist(); store.del(LS.inbox); ui.pick = null; closeSheet(); ui.view = 'home'; renderHome(); toast('Alles gelöscht'); break;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.classList.contains('err')) t.classList.remove('err');
  if (t.id === 'q') { ui.q = t.value; renderList(false); }
  else if (t.id === 'f-r') onRestaurantInput();
  else if (t.id === 'f-color') setAccent(t.value); // Live-Vorschau beim Ziehen im Farbwähler
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'f-anim') { animPref = ev.target.checked; store.set(LS.anim, animPref); applyAnim(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'q') ev.target.blur();
  if (ev.key === 'Escape') closeSheet();
});
window.addEventListener('popstate', () => { if (ui.view === 'detail') goHome(); });

/* ===================== Start ===================== */
applyAnim();
applyTheme();
migrateLegacyDemo();
renderHome({ stagger: true });
if (!user) openNameSheet();
loadPhotos().then(migratePhotos).then(() => { if (photos.size) rerender(); });
})();
</script>
</body>
</html>
